<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>牛马求生记 · 一周打工闯关</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%82%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="牛马求生记">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=3.15">
</head>
<body>
<div id="app">

  <!-- 标题页 -->
  <section id="screen-title" class="screen">
    <div class="title-card">
      <div class="seal" aria-hidden="true">纯属<br>虚构</div>
      <div class="badge-row">
        <span>🐂</span>
        <svg class="bar-chart" viewBox="0 0 64 64" role="img" aria-label="柱状图">
          <rect class="b1" x="6" y="30" width="13" height="26" rx="3" fill="#52c41a"/>
          <rect class="b2" x="25" y="12" width="13" height="44" rx="3" fill="#ff4d4f"/>
          <rect class="b3" x="44" y="22" width="13" height="34" rx="3" fill="#4d9fff"/>
        </svg>
        <span>☕</span><span>🍳</span><span>🫠</span>
      </div>
      <h1 class="game-logo"><span>牛</span><span>马</span><span>求</span><span>生</span><span>记</span></h1>
      <p class="subtitle">一周打工闯关 · 卷卷科技生存实录</p>
      <p class="disclaimer">本游戏纯属虚构，如有雷同，说明你也在上班。</p>
      <div class="btn-col">
        <button id="btn-new" class="btn primary big">入职报到</button>
        <button id="btn-continue" class="btn ghost big hidden">继续上周的班</button>
        <button id="btn-last-ending" class="btn ghost big hidden">查看上周结局</button>
      </div>
      <p class="tips">10~15 分钟一局 · 周一开周会，周日见绩效<br>手机竖屏食用效果更佳</p>
    </div>
  </section>

  <!-- 角色创建 -->
  <section id="screen-create" class="screen hidden"></section>

  <!-- 主界面 -->
  <section id="screen-main" class="screen hidden">
    <header id="topbar">
      <div class="topbar-heading"><span class="tb-brand">卷卷科技 OA</span><span id="tb-day" class="tb-day">周一 · 早间</span></div>
      <div class="tb-actions">
        <button id="profile-toggle" class="tb-btn profile-chip" aria-label="查看工牌、属性与目标" aria-haspopup="dialog"><span id="player-avatar" class="message-avatar" aria-hidden="true"></span><span id="player-name" class="profile-name"></span></button>
        <button id="btn-settings" class="tb-btn" title="设置" aria-label="打开设置" aria-haspopup="dialog">···</button>
      </div>
    </header>
    <div id="day-calendar"></div>
    <div id="main-grid">
      <aside id="sidebar"></aside>
      <main id="event-area">
        <div id="event-panel">
          <div id="event-card" class="event-card"></div>
          <button id="side-toggle" class="pack-float" aria-label="打开背包与技能" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#pack-gradient)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="pack-gradient" x1="0" y1="0" x2="1" y2="1"><stop class="pack-start" offset="0"/><stop class="pack-end" offset="1"/></linearGradient></defs><path d="M8 6V5a4 4 0 0 1 8 0v1M7 6h10a3 3 0 0 1 3 3v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a3 3 0 0 1 3-3Z"/><path d="M8 13h8v5H8zM4 10H2v8h2M20 10h2v8h-2M9 9h6"/></svg>
            <span class="pack-ready hidden" aria-hidden="true"></span>
          </button>
        </div>
        <div id="action-dock">
          <div id="choices" role="group" aria-label="回复选项"></div>
        </div>
      </main>
    </div>
  </section>

  <!-- 结局页 -->
  <section id="screen-review" class="screen hidden"></section>
  <section id="screen-ending" class="screen hidden"></section>

  <!-- 覆盖层 -->
  <div id="overlay" class="hidden"><div id="overlay-card" class="overlay-card" role="dialog" aria-modal="true" aria-live="polite"></div></div>
  <div id="mini-toast" role="status" aria-live="polite"></div>
  <!-- 全局错误边界：任何运行时异常都给出可见提示与恢复入口 -->
  <div id="error-banner" class="hidden" role="alert" aria-live="assertive">
    <div class="err-title">⚠ 出了点问题</div>
    <div class="err-text" id="error-text"></div>
    <div class="err-actions">
      <button id="err-skip" class="btn primary sm">跳到下一时段</button>
      <button id="err-home" class="btn ghost sm">返回标题</button>
    </div>
  </div>
</div>

<!-- 数据层 -->
<script src="data/characters.js?v=3.15"></script>
<script src="data/endings.js?v=3.15"></script>
  <script src="data/persona_endings.js?v=3.15"></script>
<script src="data/achievements.js?v=3.15"></script>
<script src="data/events_general.js?v=3.15"></script>
<script src="data/events_line_a.js?v=3.15"></script>
<script src="data/events_line_b.js?v=3.15"></script>
<script src="data/events_line_c.js?v=3.15"></script>
<script src="data/events_boss.js?v=3.15"></script>
  <script src="data/filler.js?v=3.15"></script>
<!-- 逻辑层 -->
<script src="js/state.js?v=3.15"></script>
<script src="js/engine.js?v=3.15"></script>
<script src="js/ui.js?v=3.15"></script>
<script src="js/main.js?v=3.15"></script>
  <noscript>
    <p style="padding:24px;color:#e04545;background:#15171d;font-size:14px;line-height:1.8">
      这个游戏需要 JavaScript 才能运行。请在浏览器设置里开启后刷新页面。
    </p>
  </noscript>
</body>
</html>
