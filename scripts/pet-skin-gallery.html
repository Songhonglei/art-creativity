<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沪上游侠 v0.9.0 · 宠物皮肤图鉴</title><style>
@font-face{font-family:Chinese;src:url('/fonts/zh-sans.woff2')}*{box-sizing:border-box}body{margin:0;background:#111f2c;color:#e7e1cd;font-family:Chinese,sans-serif}main{width:1200px;max-width:100%;margin:auto;padding:32px}h1{font-weight:500;margin:0 0 8px;font-size:28px}p{color:#acbfc9;font-size:14px;margin:0 0 24px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative}.item{height:238px;position:relative;border:1px solid #3b5260;background:#192b37}.item>div{height:170px}.item strong,.item small{display:block;padding:0 14px}strong{font-size:16px;font-weight:500}small{font-size:12px;color:#b6c5cc;margin-top:7px}.item span{color:#e4c57a;margin-right:8px}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#labels{position:relative;z-index:1}
</style></head><body><main><h1>江湖伙伴 · 等级皮肤图鉴</h1><p>沪上游侠 v0.9.0 · 橘猫保命 / 柯基续航 / 柴犬探索与破绽 · 4、7、10 级解锁，原皮肤始终保留</p><div class="gallery" id="gallery"></div></main><script type="module">
import * as THREE from 'three';import {createPet} from '/src/game/creatures.ts';import {PET_IDS,PET_SKINS,PET_NAMES} from '/src/game/pets.ts';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.setClearColor('#000000',0);renderer.setScissorTest(true);document.body.appendChild(renderer.domElement);
const views=[];for(const pet of PET_IDS)for(const skin of PET_SKINS[pet]){const item=document.createElement('section');item.className='item';item.innerHTML=`<div></div><strong><span>${skin.level===1?'原皮肤':`Lv.${skin.level}`}</span>${skin.name}</strong><small>${PET_NAMES[pet]} · ${skin.desc}</small>`;document.querySelector('#gallery').appendChild(item);const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight('#e0f2f3','#5d4938',2.3));const key=new THREE.DirectionalLight('#ffe4b7',3.2);key.position.set(1,2,2);scene.add(key);const rim=new THREE.DirectionalLight('#83c0d6',1.7);rim.position.set(-2,1,-1);scene.add(rim);const model=createPet(pet,skin.id);model.rotation.y=.15;scene.add(model);const camera=new THREE.PerspectiveCamera(33,1,.1,10);camera.position.set(1.25,.85,1.65);camera.lookAt(0,.27,0);views.push({scene,camera,box:item.firstElementChild});}
function render(){renderer.setSize(innerWidth,innerHeight);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const{scene,camera,box}of views){const b=box.getBoundingClientRect();camera.aspect=b.width/b.height;camera.updateProjectionMatrix();renderer.setViewport(b.left,innerHeight-b.bottom,b.width,b.height);renderer.setScissor(b.left,innerHeight-b.bottom,b.width,b.height);renderer.render(scene,camera);}}
window.addEventListener('resize',render);window.addEventListener('scroll',render);render();window.galleryReady=true;
</script></body></html>
