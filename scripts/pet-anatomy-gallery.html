<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>宠物独立建模 · 同材质对照</title><style>@font-face{font-family:Chinese;src:url('/fonts/zh-sans.woff2')}*{box-sizing:border-box}body{margin:0;background:#14232e;color:#e3e7de;font-family:Chinese,sans-serif}main{position:relative;z-index:1;width:1100px;margin:auto;padding:28px}h1{font-size:28px;font-weight:500;margin:0 0 8px}p{font-size:14px;color:#b2c4cb;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cell{border:1px solid #455c68;background:transparent;height:260px}.cell>div{height:215px}.cell>strong{display:block;font-size:16px;font-weight:500;padding:8px 16px}canvas{z-index:0;position:fixed;inset:0;pointer-events:none}</style></head><body><main><h1>宠物独立建模 · 同材质对照</h1><p>不穿皮肤，同一灰色材质、相同世界缩放与相机距离。每排正面／侧面，比较身体、四肢、头脸和尾巴。</p><div class="grid" id="grid"></div></main><script type="module">
import * as THREE from 'three';import {createPet} from '/src/game/creatures.ts';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(1);renderer.setClearColor('#000',0);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const views=[];
for(const [pet,name]of[['orangeCat','橘猫'],['corgi','柯基：长身、宽胸、短腿、短尾'],['shiba','柴犬：紧凑躯干、长腿、狐脸、厚卷尾']])for(const side of[false,true]){const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<div></div><strong>${name} · ${side?'侧面':'正面'}</strong>`;document.querySelector('#grid').appendChild(cell);const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight('#e3f1ef','#60717a',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(2,3,4);scene.add(light);const model=createPet(pet);model.getObjectByName('pet-outfit').visible=false;model.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({color:'#a8bdc5',roughness:.92});});scene.add(model);const camera=new THREE.PerspectiveCamera(33,1,.1,10);camera.position.set(side?2.6:0,1.05,side?0:2.6);camera.lookAt(0,.43,0);views.push({scene,camera,box:cell.firstElementChild});}
function render(){renderer.setSize(innerWidth,innerHeight);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const{scene,camera,box}of views){const b=box.getBoundingClientRect();camera.aspect=b.width/b.height;camera.updateProjectionMatrix();renderer.setViewport(b.left,innerHeight-b.bottom,b.width,b.height);renderer.setScissor(b.left,innerHeight-b.bottom,b.width,b.height);renderer.render(scene,camera);}}window.addEventListener('resize',render);window.addEventListener('scroll',render);render();window.galleryReady=true;
</script></body></html>
